<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Hand Tracking Particles - Improved</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background: #000; 
            font-family: Arial, sans-serif; 
        }

        /* Container Kamera & Skeleton Canvas */
        #cam-container {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 140px;
            height: 105px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            overflow: hidden;
            z-index: 10;
            background: #000;
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #skeleton-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }

        @media (orientation: landscape) {
            #cam-container {
                width: 120px;
                height: 90px;
                top: 10px;
                right: 10px;
            }
        }

        #webgl-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        #start {
            position: fixed;
            z-index: 20;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }

        #loading {
            position: fixed;
            z-index: 15;
            left: 50%;
            top: 58%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div id="cam-container">
    <video id="camera" autoplay playsinline></video>
    <canvas id="skeleton-canvas"></canvas>
</div>

<div id="webgl-container"></div>

<div id="ui">✋ TUNJUKKAN GESTUR JARI</div>
<button id="start">AKTIFKAN KAMERA</button>
<div id="loading">Memuat MediaPipe & Three.js...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const video = document.getElementById('camera');
const canvasElement = document.getElementById('skeleton-canvas');
const canvasCtx = canvasElement.getContext('2d');
const startBtn = document.getElementById('start');
const loading = document.getElementById('loading');
const ui = document.getElementById('ui');

const NUM_PARTICLES = 4000;
let scene, camera3D, renderer, particleSystem, geometry;
let currentPositions = new Float32Array(NUM_PARTICLES * 3);
let targetPositions = new Float32Array(NUM_PARTICLES * 3);
let currentColors = new Float32Array(NUM_PARTICLES * 3);
let targetColors = new Float32Array(NUM_PARTICLES * 3);

let activeShape = "sphere";
let targetHandX = 0;
let targetHandY = 0;

// ==========================================
// FORMULA BENTUK PARTIKEL 3D (FRONT FACING)
// ==========================================

function generateSphere() {
    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const u = Math.random(), v = Math.random();
        const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
        const r = 4.0 + Math.random() * 0.5;

        pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i * 3 + 2] = r * Math.cos(phi);

        // Biru & Cyan Glow
        col[i * 3]     = 0.1 + Math.random() * 0.3;
        col[i * 3 + 1] = 0.6 + Math.random() * 0.4;
        col[i * 3 + 2] = 0.9 + Math.random() * 0.1;
    }
    return { pos, col };
}

function generateCube() {
    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * 7;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 7;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 7;

        // Cyan / Magenta Glowing
        if (Math.random() > 0.5) {
            col[i * 3]     = 0.0; col[i * 3 + 1] = 0.9; col[i * 3 + 2] = 1.0;
        } else {
            col[i * 3]     = 1.0; col[i * 3 + 1] = 0.2; col[i * 3 + 2] = 0.8;
        }
    }
    return { pos, col };
}

function generateHeart() {
    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const t = Math.random() * Math.PI * 2;
        const scale = 0.25;
        
        // Formula Heart 2D/3D Tegak Menghadap Kamera (XY plane)
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const z = (Math.random() - 0.5) * 4;

        pos[i * 3]     = x * scale;
        pos[i * 3 + 1] = y * scale;
        pos[i * 3 + 2] = z * scale;

        // Neon Red / Pink Glowing
        col[i * 3]     = 1.0;
        col[i * 3 + 1] = 0.05 + Math.random() * 0.25;
        col[i * 3 + 2] = 0.3 + Math.random() * 0.4;
    }
    return { pos, col };
}

function generateSaturn() {
    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        if (i < NUM_PARTICLES * 0.45) {
            // Inti Bola Oranye
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 2.2;
            pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            pos[i * 3 + 2] = r * Math.cos(phi);

            col[i * 3]     = 1.0; 
            col[i * 3 + 1] = 0.4 + Math.random() * 0.3; 
            col[i * 3 + 2] = 0.0;
        } else {
            // Cincin Kuning Miring Menghadap Kamera
            const angle = Math.random() * Math.PI * 2;
            const dist = 3.6 + Math.random() * 2.6;
            const rx = Math.cos(angle) * dist;
            const ry = (Math.random() - 0.5) * 0.3;
            const rz = Math.sin(angle) * dist;

            // Rotasi cincin 30 derajat agar kelihatan 3D menghadap depan
            const cosA = Math.cos(0.4), sinA = Math.sin(0.4);
            pos[i * 3]     = rx;
            pos[i * 3 + 1] = ry * cosA - rz * sinA;
            pos[i * 3 + 2] = ry * sinA + rz * cosA;

            col[i * 3]     = 1.0; 
            col[i * 3 + 1] = 0.85; 
            col[i * 3 + 2] = 0.2;
        }
    }
    return { pos, col };
}

const shapes = {
    sphere: generateSphere(),
    cube: generateCube(),
    heart: generateHeart(),
    saturn: generateSaturn()
};

// ==========================================
// THREE.JS SETUP
// ==========================================

function initThree() {
    const container = document.getElementById('webgl-container');
    scene = new THREE.Scene();

    camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.z = 13;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    geometry = new THREE.BufferGeometry();
    
    const initData = shapes.sphere;
    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        currentPositions[i] = initData.pos[i];
        targetPositions[i]  = initData.pos[i];
        currentColors[i]    = initData.col[i];
        targetColors[i]     = initData.col[i];
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(currentColors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
    });

    particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('orientationchange', onWindowResize);
}

function onWindowResize() {
    camera3D.aspect = window.innerWidth / window.innerHeight;
    camera3D.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function setTargetShape(shapeName) {
    if (activeShape === shapeName) return;
    activeShape = shapeName;
    const shapeData = shapes[shapeName];
    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        targetPositions[i] = shapeData.pos[i];
        targetColors[i]    = shapeData.col[i];
    }
}

// ==========================================
// DETEKSI GESTUR & POSISI TANGAN
// ==========================================

function processHand(lm) {
    // 1. Dapatkan posisi tengah telapak tangan (MCP Jari Tengah - Landmark 9)
    const palmX = (0.5 - lm[9].x) * 14; // Skala gerak horizontal 3D
    const palmY = (0.5 - lm[9].y) * 10; // Skala gerak vertikal 3D
    
    targetHandX = palmX;
    targetHandY = palmY;

    // 2. Deteksi Jari Terbuka
    const wrist = lm[0];
    const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

    const indexOpen  = dist(lm[8], wrist) > dist(lm[6], wrist);
    const middleOpen = dist(lm[12], wrist) > dist(lm[10], wrist);
    const ringOpen   = dist(lm[16], wrist) > dist(lm[14], wrist);
    const pinkyOpen  = dist(lm[20], wrist) > dist(lm[18], wrist);

    if (indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('saturn');
        ui.textContent = "☝️ 1 JARI → CINCIN SATURNUS";
    }
    else if (indexOpen && middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('cube');
        ui.textContent = "✌️ 2 JARI → KUBUS PARTIKEL";
    }
    else if (!indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('heart');
        ui.textContent = "✊ GENGGAM → BENTUK HEART ❤️";
    }
    else if (indexOpen && middleOpen && ringOpen && pinkyOpen) {
        setTargetShape('sphere');
        ui.textContent = "✋ TELAPAK BUKA → BOLA PARTIKEL";
    }
}

// ==========================================
// MEDIAPIPE HANDS & DRAW SKELETON
// ==========================================

const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
});

hands.onResults((results) => {
    // Canvas Skeleton Reset
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Gambar Garis & Titik Tangan (Skeleton)
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FFCC', lineWidth: 3 });
        drawLandmarks(canvasCtx, landmarks, { color: '#FF0055', lineWidth: 2, radius: 4 });

        processHand(landmarks);
    } else {
        ui.textContent = "✋ TUNJUKKAN GESTUR JARI";
    }
    canvasCtx.restore();
});

// ==========================================
// RENDER LOOP (ANIMASI LERP)
// ==========================================

function animate() {
    requestAnimationFrame(animate);

    const positions = geometry.attributes.position.array;
    const colorsArr = geometry.attributes.color.array;

    // Lerp Posisi Partikel ke Bentuk Baru
    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        positions[i] += (targetPositions[i] - positions[i]) * 0.08;
        colorsArr[i] += (targetColors[i] - colorsArr[i]) * 0.08;
    }
    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;

    // Partikel Mengikuti Posisi Tangan 3D secara Halus
    if (particleSystem) {
        particleSystem.position.x += (targetHandX - particleSystem.position.x) * 0.1;
        particleSystem.position.y += (targetHandY - particleSystem.position.y) * 0.1;

        particleSystem.rotation.y += 0.005;
    }

    renderer.render(scene, camera3D);
}

// ==========================================
// START CAMERA
// ==========================================

startBtn.addEventListener('click', async () => {
    startBtn.style.display = 'none';
    loading.style.display = 'block';

    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }

    initThree();
    animate();

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });

        video.srcObject = stream;

        // Atur ukuran canvas skeleton sesuai ukuran video
        video.onloadedmetadata = () => {
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;
        };

        const cameraUtils = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 640,
            height: 480
        });

        cameraUtils.start();
        loading.style.display = 'none';
    } catch (err) {
        loading.style.display = 'none';
        startBtn.style.display = 'block';
        alert('Kamera gagal dibuka!');
        console.error(err);
    }
});
</script>

</body>
 </html>
