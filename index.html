<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Blue Whale Hand AR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#camera{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:1;
}

#threeCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

#handCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:3;
    pointer-events:none;
}

#loading{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:#000;
    color:white;
    text-align:center;
}

.loader{
    width:45px;
    height:45px;
    border:4px solid rgba(255,255,255,.2);
    border-top:4px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:20px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#start{
    position:fixed;
    left:50%;
    bottom:35px;
    transform:translateX(-50%);
    z-index:30;

    border:1px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.6);
    color:white;

    padding:14px 28px;
    border-radius:30px;

    font-size:15px;
    font-weight:bold;

    backdrop-filter:blur(10px);
}

#info{
    position:fixed;
    top:20px;
    left:20px;
    z-index:10;

    color:white;

    font-size:11px;
    letter-spacing:1px;

    background:rgba(0,0,0,.35);
    padding:10px 14px;
    border-radius:12px;

    backdrop-filter:blur(8px);

    opacity:.8;
}

#status{
    margin-top:8px;
    color:#66d9ff;
}

#error{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:85%;

    color:white;
    text-align:center;

    background:rgba(0,0,0,.8);
    border:1px solid rgba(255,255,255,.2);

    padding:20px;
    border-radius:18px;

    z-index:50;

    display:none;
}
</style>
</head>

<body>

<!-- CAMERA -->
<video id="camera" autoplay muted playsinline></video>

<!-- THREE.JS -->
<canvas id="threeCanvas"></canvas>

<!-- HAND LANDMARK -->
<canvas id="handCanvas"></canvas>

<div id="loading">

    <div class="loader"></div>

    <div>
        Menyiapkan Blue Whale AR...
    </div>

</div>

<div id="info">
    BLUE WHALE AR
    <div id="status">
        Menunggu kamera...
    </div>
</div>

<button id="start">
    AKTIFKAN KAMERA
</button>

<div id="error"></div>


<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =========================================================
   ELEMENT
========================================================= */

const video =
    document.getElementById("camera");

const threeCanvas =
    document.getElementById("threeCanvas");

const handCanvas =
    document.getElementById("handCanvas");

const handCtx =
    handCanvas.getContext("2d");

const loading =
    document.getElementById("loading");

const startBtn =
    document.getElementById("start");

const statusText =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");


/* =========================================================
   GLOBAL
========================================================= */

let scene;
let renderer;
let whale;
let whaleGroup;
let boundingBox;

let handsDetected = 0;

let targetX = 0;
let targetY = 0;
let targetScale = 1;

let currentX = 0;
let currentY = 0;
let currentScale = 1;

let targetRotX = 0;
let targetRotY = 0;

let currentRotX = 0;
let currentRotY = 0;

let hand1 = null;
let hand2 = null;


/* =========================================================
   THREE.JS SETUP
========================================================= */

function initThree(){

    scene = new THREE.Scene();

    /*
       CAMERA
    */

    const camera =
        new THREE.OrthographicCamera(
            -1,
             1,
             1,
            -1,
            0.1,
            100
        );

    camera.position.z = 10;

    scene.userData.camera = camera;


    /*
       RENDERER
    */

    renderer =
        new THREE.WebGLRenderer({
            canvas:threeCanvas,
            alpha:true,
            antialias:true
        });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    /*
       LIGHT
    */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2
        );

    scene.add(ambient);


    const directional =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    directional.position.set(
        2,
        3,
        5
    );

    scene.add(directional);


    /*
       WHALE
    */

    whaleGroup =
        new THREE.Group();

    scene.add(whaleGroup);


    createWhale();


    /*
       BOUNDING BOX
    */

    createBoundingBox();


    /*
       RESIZE
    */

    window.addEventListener(
        "resize",
        resize
    );


    animate();
}


/* =========================================================
   CREATE BLUE WHALE
========================================================= */

function createWhale(){

    whaleGroup.clear();


    /*
       BODY
    */

    const bodyGeometry =
        new THREE.SphereGeometry(
            1,
            48,
            32
        );

    const bodyMaterial =
        new THREE.MeshStandardMaterial({

            color:0x1677a8,

            roughness:.42,

            metalness:.05

        });

    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.scale.set(
        1.65,
        .65,
        .65
    );

    whaleGroup.add(body);


    /*
       HEAD
    */

    const headGeometry =
        new THREE.SphereGeometry(
            .65,
            40,
            28
        );

    const headMaterial =
        new THREE.MeshStandardMaterial({

            color:0x238bb9,

            roughness:.4

        });

    const head =
        new THREE.Mesh(
            headGeometry,
            headMaterial
        );

    head.position.x = 1.25;

    head.scale.set(
        1.05,
        .8,
        .8
    );

    whaleGroup.add(head);


    /*
       SNOUT
    */

    const snoutGeometry =
        new THREE.SphereGeometry(
            .38,
            32,
            20
        );

    const snout =
        new THREE.Mesh(
            snoutGeometry,
            bodyMaterial
        );

    snout.position.set(
        1.85,
        -.02,
        0
    );

    snout.scale.set(
        1.2,
        .55,
        .8
    );

    whaleGroup.add(snout);


    /*
       DORSAL FIN
    */

    const finMaterial =
        new THREE.MeshStandardMaterial({

            color:0x0d5276,

            side:THREE.DoubleSide,

            roughness:.5

        });


    const dorsalShape =
        new THREE.Shape();

    dorsalShape.moveTo(0,0);

    dorsalShape.lineTo(
        .25,
        .75
    );

    dorsalShape.lineTo(
        .55,
        0
    );

    dorsalShape.lineTo(
        0,
        0
    );


    const dorsalGeometry =
        new THREE.ShapeGeometry(
            dorsalShape
        );

    const dorsal =
        new THREE.Mesh(
            dorsalGeometry,
            finMaterial
        );

    dorsal.position.set(
        -.1,
        .48,
        0
    );

    dorsal.rotation.x =
        Math.PI / 2;

    whaleGroup.add(dorsal);


    /*
       LEFT FLIPPER
    */

    const flipperShape =
        new THREE.Shape();

    flipperShape.moveTo(0,0);

    flipperShape.quadraticCurveTo(
        -.2,
        -.1,
        -.9,
        -.75
    );

    flipperShape.quadraticCurveTo(
        -.45,
        -.15,
        .1,
        .05
    );

    const flipperGeometry =
        new THREE.ShapeGeometry(
            flipperShape
        );

    const leftFlipper =
        new THREE.Mesh(
            flipperGeometry,
            finMaterial
        );

    leftFlipper.position.set(
        .45,
        -.25,
        .45
    );

    leftFlipper.rotation.x =
        -0.4;

    whaleGroup.add(leftFlipper);


    /*
       RIGHT FLIPPER
    */

    const rightFlipper =
        new THREE.Mesh(
            flipperGeometry,
            finMaterial
        );

    rightFlipper.position.set(
        .45,
        -.25,
        -.45
    );

    rightFlipper.rotation.x =
        -0.4;

    rightFlipper.rotation.y =
        Math.PI;

    whaleGroup.add(rightFlipper);


    /*
       TAIL
    */

    createTail(
        -1.65,
        0,
        0,
        1
    );


    /*
       EYE
    */

    createEye(
        1.65,
        .22,
        .48
    );

    createEye(
        1.65,
        .22,
        -.48
    );


    /*
       MOUTH LINE
    */

    const mouthCurve =
        new THREE.EllipseCurve(
            1.72,
            -.02,
            .3,
            .12,
            0,
            Math.PI,
            false,
            0
        );

    const mouthPoints =
        mouthCurve.getPoints(30);

    const mouthGeometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                mouthPoints.map(
                    p =>
                        new THREE.Vector3(
                            p.x,
                            p.y,
                            .61
                        )
                )
            );

    const mouthMaterial =
        new THREE.LineBasicMaterial({
            color:0x062f45
        });

    const mouth =
        new THREE.Line(
            mouthGeometry,
            mouthMaterial
        );

    whaleGroup.add(mouth);


    /*
       WHALE HIGHLIGHT
    */

    const highlightGeometry =
        new THREE.SphereGeometry(
            1,
            32,
            20
        );

    const highlightMaterial =
        new THREE.MeshBasicMaterial({

            color:0x55d8ff,

            transparent:true,

            opacity:.12

        });

    const highlight =
        new THREE.Mesh(
            highlightGeometry,
            highlightMaterial
        );

    highlight.scale.set(
        1.5,
        .35,
        .7
    );

    highlight.position.set(
        .3,
        .2,
        .1
    );

    whaleGroup.add(highlight);
}


/* =========================================================
   TAIL
========================================================= */

function createTail(
    x,
    y,
    z,
    direction
){

    const material =
        new THREE.MeshStandardMaterial({

            color:0x0d5276,

            side:THREE.DoubleSide,

            roughness:.5

        });


    const shape =
        new THREE.Shape();

    shape.moveTo(0,0);

    shape.quadraticCurveTo(
        -.35,
        .65,
        -.85,
        .55
    );

    shape.quadraticCurveTo(
        -.5,
        .1,
        0,
        0
    );


    const geo =
        new THREE.ShapeGeometry(
            shape
        );


    const tail1 =
        new THREE.Mesh(
            geo,
            material
        );

    tail1.position.set(
        x,
        y,
        z + .2
    );

    tail1.rotation.y =
        Math.PI / 2;

    whaleGroup.add(tail1);


    const tail2 =
        new THREE.Mesh(
            geo,
            material
        );

    tail2.position.set(
        x,
        y,
        z - .2
    );

    tail2.rotation.y =
        Math.PI / 2;

    tail2.rotation.z =
        Math.PI;

    whaleGroup.add(tail2);
}


/* =========================================================
   EYES
========================================================= */

function createEye(
    x,
    y,
    z
){

    const geo =
        new THREE.SphereGeometry(
            .055,
            16,
            16
        );

    const mat =
        new THREE.MeshBasicMaterial({
            color:0x020609
        });

    const eye =
        new THREE.Mesh(
            geo,
            mat
        );

    eye.position.set(
        x,
        y,
        z
    );

    whaleGroup.add(eye);
}


/* =========================================================
   BOUNDING BOX
========================================================= */

function createBoundingBox(){

    const boxGeo =
        new THREE.BoxGeometry(
            3.8,
            1.8,
            1.7
        );


    const edges =
        new THREE.EdgesGeometry(
            boxGeo
        );


    const material =
        new THREE.LineBasicMaterial({

            color:0xffffff,

            transparent:true,

            opacity:.75

        });


    boundingBox =
        new THREE.LineSegments(
            edges,
            material
        );


    boundingBox.scale.set(
        1.05,
        1.05,
        1.05
    );


    whaleGroup.add(
        boundingBox
    );
}


/* =========================================================
   MEDIAPIPE HANDS
========================================================= */

const hands =
    new Hands({

        locateFile:
        file => {

            return `
            https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}
            `;

        }

    });


hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.65,

    minTrackingConfidence:.6

});


hands.onResults(
    onHands
);


/* =========================================================
   CAMERA START
========================================================= */

async function startCamera(){

    try{

        statusText.innerText =
            "Meminta izin kamera...";


        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        facingMode:"user",

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        }
                    },

                    audio:false

                });


        video.srcObject =
            stream;


        await video.play();


        loading.style.display =
            "none";

        startBtn.style.display =
            "none";


        statusText.innerText =
            "Kamera aktif";


        resize();


        processCamera();


    }catch(error){

        console.error(error);

        loading.style.display =
            "none";

        errorBox.style.display =
            "block";

        errorBox.innerHTML = `
            <b>Kamera tidak bisa dibuka</b>
            <br><br>
            Pastikan izin kamera diberikan
            dan website dibuka melalui HTTPS.
            <br><br>
            Jika menggunakan file HTML langsung,
            coba jalankan melalui server lokal
            atau upload ke Vercel/Netlify.
        `;

    }

}


/* =========================================================
   PROCESS CAMERA
========================================================= */

async function processCamera(){

    if(
        video.readyState >= 2
    ){

        await hands.send({
            image:video
        });

    }

    requestAnimationFrame(
        processCamera
    );
}


/* =========================================================
   HAND RESULTS
========================================================= */

function onHands(results){

    drawHands(results);


    if(
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ){

        handsDetected = 0;

        statusText.innerText =
            "Cari tangan...";

        return;

    }


    handsDetected =
        results.multiHandLandmarks.length;


    if(
        handsDetected === 1
    ){

        hand1 =
            results.multiHandLandmarks[0];

        hand2 = null;

        controlWithOneHand();

    }else{

        hand1 =
            results.multiHandLandmarks[0];

        hand2 =
            results.multiHandLandmarks[1];

        controlWithTwoHands();

    }


    statusText.innerText =
        handsDetected +
        " tangan terdeteksi";
}


/* =========================================================
   ONE HAND CONTROL
========================================================= */

function controlWithOneHand(){

    const wrist =
        hand1[0];


    /*
       MIRROR X
    */

    targetX =
        (0.5 - wrist.x) * 4.2;


    targetY =
        (0.5 - wrist.y) * 3.2;


    targetScale =
        1.15;


    targetRotY =
        (0.5 - wrist.x) *
        1.5;


    targetRotX =
        (wrist.y - 0.5) *
        1.0;
}


/* =========================================================
   TWO HAND CONTROL
========================================================= */

function controlWithTwoHands(){

    const a =
        hand1[9];

    const b =
        hand2[9];


    /*
       CENTER
    */

    const centerX =
        (a.x + b.x) / 2;

    const centerY =
        (a.y + b.y) / 2;


    /*
       POSITION
    */

    targetX =
        (0.5 - centerX) *
        4.2;

    targetY =
        (0.5 - centerY) *
        3.2;


    /*
       DISTANCE
    */

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       SCALE
    */

    targetScale =
        THREE.MathUtils.clamp(
            distance * 4.2,
            .55,
            2.8
        );


    /*
       ROTATION
    */

    targetRotY =
        (centerX - .5) *
        -2.0;


    targetRotX =
        (centerY - .5) *
        1.2;
}


/* =========================================================
   DRAW HANDS
========================================================= */

function drawHands(results){

    handCtx.clearRect(
        0,
        0,
        handCanvas.width,
        handCanvas.height
    );


    if(
        !results.multiHandLandmarks
    ) return;


    for(
        const landmarks
        of results.multiHandLandmarks
    ){

        /*
           LANDMARK DOTS
        */

        for(
            const point
            of landmarks
        ){

            const x =
                (1 - point.x) *
                handCanvas.width;

            const y =
                point.y *
                handCanvas.height;


            handCtx.beginPath();

            handCtx.arc(
                x,
                y,
                3,
                0,
                Math.PI * 2
            );

            handCtx.fillStyle =
                "rgba(255,255,255,.9)";

            handCtx.fill();

        }


        /*
           CONNECTIONS
        */

        const connections = [

            [0,1],
            [1,2],
            [2,3],
            [3,4],

            [0,5],
            [5,6],
            [6,7],
            [7,8],

            [5,9],
            [9,10],
            [10,11],
            [11,12],

            [9,13],
            [13,14],
            [14,15],
            [15,16],

            [13,17],
            [17,18],
            [18,19],
            [19,20],

            [0,17]

        ];


        handCtx.lineWidth =
            1;


        handCtx.strokeStyle =
            "rgba(255,255,255,.35)";


        for(
            const pair
            of connections
        ){

            const p1 =
                landmarks[pair[0]];

            const p2 =
                landmarks[pair[1]];


            handCtx.beginPath();

            handCtx.moveTo(
                (1-p1.x) *
                handCanvas.width,

                p1.y *
                handCanvas.height
            );

            handCtx.lineTo(
                (1-p2.x) *
                handCanvas.width,

                p2.y *
                handCanvas.height
            );

            handCtx.stroke();
        }

    }

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    /*
       SMOOTH MOVEMENT
    */

    currentX +=
        (targetX - currentX) *
        .09;


    currentY +=
        (targetY - currentY) *
        .09;


    currentScale +=
        (targetScale - currentScale) *
        .09;


    currentRotX +=
        (targetRotX - currentRotX) *
        .07;


    currentRotY +=
        (targetRotY - currentRotY) *
        .07;


    /*
       APPLY POSITION
    */

    whaleGroup.position.x =
        currentX;


    whaleGroup.position.y =
        currentY;


    whaleGroup.scale.setScalar(
        currentScale
    );


    whaleGroup.rotation.x =
        currentRotX;


    whaleGroup.rotation.y =
        currentRotY;


    /*
       FLOATING EFFECT
    */

    const time =
        performance.now() *
        0.001;


    whaleGroup.position.z =
        Math.sin(time * 1.5) *
        0.08;


    /*
       SWIMMING MOTION
    */

    const tailWave =
        Math.sin(time * 3) *
        0.08;


    whaleGroup.rotation.z =
        tailWave;


    render();
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const camera =
        scene.userData.camera;


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    renderer.setSize(
        w,
        h
    );


    handCanvas.width =
        w;

    handCanvas.height =
        h;


    /*
       CAMERA ASPECT
    */

    const aspect =
        w / h;


    const camera =
        scene.userData.camera;


    camera.left =
        -aspect;

    camera.right =
        aspect;

    camera.top =
        1;

    camera.bottom =
        -1;


    camera.updateProjectionMatrix();
}


/* =========================================================
   START BUTTON
========================================================= */

startBtn.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   INITIALIZE
========================================================= */

initThree();

</script>

</body>
</html>
