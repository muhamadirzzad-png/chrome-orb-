<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Hand Tracking - Fast & Smooth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background: #000; 
            font-family: Arial, sans-serif; 
        }

        #cam-container {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 130px;
            height: 95px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            overflow: hidden;
            z-index: 10;
            background: #000;
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #skeleton-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
        }

        @media (orientation: landscape) {
            #cam-container {
                width: 110px;
                height: 80px;
                top: 10px;
                right: 10px;
            }
        }

        #webgl-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        #start {
            position: fixed;
            z-index: 20;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            cursor: pointer;
        }

        #loading {
            position: fixed;
            z-index: 15;
            left: 50%;
            top: 58%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div id="cam-container">
    <video id="camera" autoplay playsinline></video>
    <canvas id="skeleton-canvas"></canvas>
</div>

<div id="webgl-container"></div>

<div id="ui">✋ TUNJUKKAN GESTUR JARI</div>
<button id="start">AKTIFKAN KAMERA</button>
<div id="loading">Memuat MediaPipe & Three.js...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const video = document.getElementById('camera');
const canvasElement = document.getElementById('skeleton-canvas');
const canvasCtx = canvasElement.getContext('2d');
const startBtn = document.getElementById('start');
const loading = document.getElementById('loading');
const ui = document.getElementById('ui');

// Optimasi jumlah partikel agar tidak nge-lag di HP (3000 Pts)
const NUM_PARTICLES = 3000;
let scene, camera3D, renderer, particleSystem, geometry;
let currentPositions = new Float32Array(NUM_PARTICLES * 3);
let targetPositions = new Float32Array(NUM_PARTICLES * 3);
let currentColors = new Float32Array(NUM_PARTICLES * 3);
let targetColors = new Float32Array(NUM_PARTICLES * 3);

let activeShape = "random";
let targetHandX = 0;
let targetHandY = 0;

// ==========================================
// FORMULA BENTUK PARTIKEL
// ==========================================

function generateRandomParticles() {
    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * 20;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 20;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 12;

        col[i * 3]     = 0.2 + Math.random() * 0.4;
        col[i * 3 + 1] = 0.5 + Math.random() * 0.4;
        col[i * 3 + 2] = 0.8 + Math.random() * 0.2;
    }
    return { pos, col };
}

function generateTextILoveYou() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 50px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('I LOVE YOU', canvas.width / 2, canvas.height / 2);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const validPixels = [];

    for (let y = 0; y < canvas.height; y += 2) {
        for (let x = 0; x < canvas.width; x += 2) {
            const index = (y * canvas.width + x) * 4;
            if (imgData[index] > 128) {
                const posX = (x - canvas.width / 2) * 0.032;
                const posY = (canvas.height / 2 - y) * 0.032;
                validPixels.push({ x: posX, y: posY });
            }
        }
    }

    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);

    for (let i = 0; i < NUM_PARTICLES; i++) {
        const p = validPixels[i % validPixels.length];
        pos[i * 3]     = p.x + (Math.random() - 0.5) * 0.1;
        pos[i * 3 + 1] = p.y + (Math.random() - 0.5) * 0.1;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 0.5;

        // Biru Cyan Glowing 💙
        col[i * 3]     = 0.0;
        col[i * 3 + 1] = 0.85;
        col[i * 3 + 2] = 1.0;
    }
    return { pos, col };
}

function generateHeart() {
    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const t = Math.random() * Math.PI * 2;
        const scale = 0.25;
        
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const z = (Math.random() - 0.5) * 3;

        pos[i * 3]     = x * scale;
        pos[i * 3 + 1] = y * scale;
        pos[i * 3 + 2] = z * scale;

        // Merah Neon ❤️
        col[i * 3]     = 1.0;
        col[i * 3 + 1] = 0.05;
        col[i * 3 + 2] = 0.3;
    }
    return { pos, col };
}

function generateSaturn() {
    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        if (i < NUM_PARTICLES * 0.45) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 2.0;
            pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            pos[i * 3 + 2] = r * Math.cos(phi);

            col[i * 3]     = 1.0; 
            col[i * 3 + 1] = 0.4; 
            col[i * 3 + 2] = 0.0;
        } else {
            const angle = Math.random() * Math.PI * 2;
            const dist = 3.2 + Math.random() * 2.2;
            const rx = Math.cos(angle) * dist;
            const ry = (Math.random() - 0.5) * 0.2;
            const rz = Math.sin(angle) * dist;

            const cosA = Math.cos(0.4), sinA = Math.sin(0.4);
            pos[i * 3]     = rx;
            pos[i * 3 + 1] = ry * cosA - rz * sinA;
            pos[i * 3 + 2] = ry * sinA + rz * cosA;

            col[i * 3]     = 1.0; 
            col[i * 3 + 1] = 0.85; 
            col[i * 3 + 2] = 0.2;
        }
    }
    return { pos, col };
}

function generateCube() {
    const pos = new Float32Array(NUM_PARTICLES * 3);
    const col = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * 6;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 6;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 6;

        col[i * 3]     = 1.0; 
        col[i * 3 + 1] = 0.1; 
        col[i * 3 + 2] = 0.8;
    }
    return { pos, col };
}

let shapes = {};

// ==========================================
// THREE.JS SETUP
// ==========================================

function initThree() {
    shapes = {
        random: generateRandomParticles(),
        text: generateTextILoveYou(),
        heart: generateHeart(),
        saturn: generateSaturn(),
        cube: generateCube()
    };

    const container = document.getElementById('webgl-container');
    scene = new THREE.Scene();

    camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.z = 13;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    container.appendChild(renderer.domElement);

    geometry = new THREE.BufferGeometry();
    
    const initData = shapes.random;
    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        currentPositions[i] = initData.pos[i];
        targetPositions[i]  = initData.pos[i];
        currentColors[i]    = initData.col[i];
        targetColors[i]     = initData.col[i];
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(currentColors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.14,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
    });

    particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
    camera3D.aspect = window.innerWidth / window.innerHeight;
    camera3D.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function setTargetShape(shapeName) {
    if (activeShape === shapeName) return;
    activeShape = shapeName;
    const shapeData = shapes[shapeName];
    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        targetPositions[i] = shapeData.pos[i];
        targetColors[i]    = shapeData.col[i];
    }
}

// ==========================================
// DETEKSI GESTUR & POSISI TANGAN
// ==========================================

function processHand(lm) {
    const palmX = (0.5 - lm[9].x) * 14;
    const palmY = (0.5 - lm[9].y) * 10;
    
    targetHandX = palmX;
    targetHandY = palmY;

    const wrist = lm[0];
    const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

    const indexOpen  = dist(lm[8], wrist) > dist(lm[6], wrist);
    const middleOpen = dist(lm[12], wrist) > dist(lm[10], wrist);
    const ringOpen   = dist(lm[16], wrist) > dist(lm[14], wrist);
    const pinkyOpen  = dist(lm[20], wrist) > dist(lm[18], wrist);

    if (indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('saturn');
        ui.textContent = "☝️ 1 JARI → CINCIN SATURNUS";
    }
    else if (indexOpen && middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('cube');
        ui.textContent = "✌️ 2 JARI → KUBUS PARTIKEL";
    }
    else if (!indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('heart');
        ui.textContent = "✊ GENGGAM → BENTUK HEART ❤️";
    }
    else if (indexOpen && middleOpen && ringOpen && pinkyOpen) {
        setTargetShape('text');
        ui.textContent = "✋ TELAPAK BUKA → TEKS I LOVE YOU 💙";
    }
}

// ==========================================
// MEDIAPIPE HANDS
// ==========================================

const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 0, // Diturunkan ke 0 agar AI sangat ringan & responsif
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

hands.onResults((results) => {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00FFCC', lineWidth: 2 });
        drawLandmarks(canvasCtx, landmarks, { color: '#FF0055', lineWidth: 1, radius: 3 });

        processHand(landmarks);
    } else {
        setTargetShape('random');
        ui.textContent = "✋ TUNJUKKAN GESTUR JARI";
    }
    canvasCtx.restore();
});

// ==========================================
// RENDER LOOP (FAST & SMOOTH TRANSITION)
// ==========================================

function animate() {
    requestAnimationFrame(animate);

    const positions = geometry.attributes.position.array;
    const colorsArr = geometry.attributes.color.array;

    // Kecepatan transisi LERP dinaikkan jadi 0.20 agar gerakannya kilat & super smooth!
    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        positions[i] += (targetPositions[i] - positions[i]) * 0.20;
        colorsArr[i] += (targetColors[i] - colorsArr[i]) * 0.20;
    }
    geometry.attributes.position.needsUpdate = true;
    geometry.attributes.color.needsUpdate = true;

    if (particleSystem) {
        particleSystem.position.x += (targetHandX - particleSystem.position.x) * 0.15;
        particleSystem.position.y += (targetHandY - particleSystem.position.y) * 0.15;

        if (activeShape !== 'text') {
            particleSystem.rotation.y += 0.008;
        } else {
            particleSystem.rotation.y = 0;
        }
    }

    renderer.render(scene, camera3D);
}

// ==========================================
// START CAMERA
// ==========================================

startBtn.addEventListener('click', async () => {
    startBtn.style.display = 'none';
    loading.style.display = 'block';

    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }

    initThree();
    animate();

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 } },
            audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
            canvasElement.width = video.videoWidth;
            canvasElement.height = video.videoHeight;
        };

        const cameraUtils = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 480,
            height: 360
        });

        cameraUtils.start();
        loading.style.display = 'none';
    } catch (err) {
        loading.style.display = 'none';
        startBtn.style.display = 'block';
        alert('Kamera gagal dibuka!');
        console.error(err);
    }
});
</script>

</body>
</html>
