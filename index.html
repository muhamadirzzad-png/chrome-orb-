<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Hand Tracking Particles - Landscape Mode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background: #000; 
            font-family: Arial, sans-serif; 
        }

        #camera {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 130px;
            height: 95px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transform: scaleX(-1);
            z-index: 10;
        }

        /* Responsive Landscape HP */
        @media (orientation: landscape) {
            #camera {
                width: 110px;
                height: 80px;
                top: 10px;
                right: 10px;
            }
        }

        #webgl-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 13px;
            text-align: center;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        #start {
            position: fixed;
            z-index: 20;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            cursor: pointer;
        }

        #loading {
            position: fixed;
            z-index: 15;
            left: 50%;
            top: 58%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<video id="camera" autoplay playsinline></video>
<div id="webgl-container"></div>

<div id="ui">✋ TUNJUKKAN GESTUR JARI</div>
<button id="start">AKTIFKAN KAMERA</button>
<div id="loading">Memuat MediaPipe & Three.js...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const video = document.getElementById('camera');
const startBtn = document.getElementById('start');
const loading = document.getElementById('loading');
const ui = document.getElementById('ui');

const NUM_PARTICLES = 3500;
let scene, camera3D, renderer, particleSystem, geometry;
let currentPositions = new Float32Array(NUM_PARTICLES * 3);
let targetPositions = new Float32Array(NUM_PARTICLES * 3);
let colors = new Float32Array(NUM_PARTICLES * 3);

let activeShape = "sphere";

// ==========================================
// FORMULA BENTUK PARTIKEL 3D
// ==========================================

function generateCube() {
    const positions = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        positions[i * 3]     = (Math.random() - 0.5) * 8;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 8;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 8;
    }
    return positions;
}

function generateSphere() {
    const positions = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = 4.5 + Math.random() * 0.5;

        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
    }
    return positions;
}

function generateHeart() {
    const positions = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        const t = Math.random() * Math.PI * 2;
        const scale = 0.28;
        
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const z = (Math.random() - 0.5) * 6;

        positions[i * 3]     = x * scale;
        positions[i * 3 + 1] = y * scale;
        positions[i * 3 + 2] = z * scale;
    }
    return positions;
}

function generateSaturn() {
    const positions = new Float32Array(NUM_PARTICLES * 3);
    for (let i = 0; i < NUM_PARTICLES; i++) {
        if (i < NUM_PARTICLES * 0.4) {
            const u = Math.random(), v = Math.random();
            const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
            const r = 2.2;
            positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = r * Math.cos(phi);
        } else {
            const angle = Math.random() * Math.PI * 2;
            const dist = 3.5 + Math.random() * 3.0;
            positions[i * 3]     = Math.cos(angle) * dist;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 0.4;
            positions[i * 3 + 2] = Math.sin(angle) * dist;
        }
    }
    return positions;
}

const shapeGenerators = {
    sphere: generateSphere(),
    cube: generateCube(),
    heart: generateHeart(),
    saturn: generateSaturn()
};

// ==========================================
// THREE.JS SETUP & LANDSCAPE RESPONSIVE
// ==========================================

function initThree() {
    const container = document.getElementById('webgl-container');
    scene = new THREE.Scene();

    camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera3D.position.z = 14;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    geometry = new THREE.BufferGeometry();
    
    const initPos = shapeGenerators.sphere;
    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        currentPositions[i] = initPos[i];
        targetPositions[i] = initPos[i];
        colors[i] = 0.3 + Math.random() * 0.7;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
    });

    particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('orientationchange', onWindowResize);
}

function onWindowResize() {
    camera3D.aspect = window.innerWidth / window.innerHeight;
    camera3D.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function setTargetShape(shapeName) {
    if (activeShape === shapeName) return;
    activeShape = shapeName;
    const newPos = shapeGenerators[shapeName];
    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        targetPositions[i] = newPos[i];
    }
}

// ==========================================
// DETEKSI GESTUR JARI
// ==========================================

function detectGesture(lm) {
    const wrist = lm[0];
    const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

    const indexOpen  = dist(lm[8], wrist) > dist(lm[6], wrist);
    const middleOpen = dist(lm[12], wrist) > dist(lm[10], wrist);
    const ringOpen   = dist(lm[16], wrist) > dist(lm[14], wrist);
    const pinkyOpen  = dist(lm[20], wrist) > dist(lm[18], wrist);

    if (indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('saturn');
        ui.textContent = "☝️ 1 JARI → CINCIN SATURNUS";
    }
    else if (indexOpen && middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('cube');
        ui.textContent = "✌️ 2 JARI → KUBUS PARTIKEL";
    }
    else if (!indexOpen && !middleOpen && !ringOpen && !pinkyOpen) {
        setTargetShape('heart');
        ui.textContent = "✊ GENGGAM → BENTUK HEART";
    }
    else if (indexOpen && middleOpen && ringOpen && pinkyOpen) {
        setTargetShape('sphere');
        ui.textContent = "✋ TELAPAK BUKA → BOLA PARTIKEL";
    }
}

// ==========================================
// MEDIAPIPE HANDS
// ==========================================

const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
});

hands.onResults((results) => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        detectGesture(results.multiHandLandmarks[0]);
    } else {
        ui.textContent = "✋ TUNJUKKAN GESTUR JARI";
    }
});

// ==========================================
// RENDER LOOP & ANIMASI LERP
// ==========================================

function animate() {
    requestAnimationFrame(animate);

    const positions = geometry.attributes.position.array;

    for (let i = 0; i < NUM_PARTICLES * 3; i++) {
        positions[i] += (targetPositions[i] - positions[i]) * 0.08;
    }
    geometry.attributes.position.needsUpdate = true;

    if (particleSystem) {
        particleSystem.rotation.y += 0.005;
        particleSystem.rotation.x += 0.002;
    }

    renderer.render(scene, camera3D);
}

// ==========================================
// START CAMERA
// ==========================================

startBtn.addEventListener('click', async () => {
    startBtn.style.display = 'none';
    loading.style.display = 'block';

    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
    }

    initThree();
    animate();

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });

        video.srcObject = stream;

        const cameraUtils = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 640,
            height: 480
        });

        cameraUtils.start();
        loading.style.display = 'none';
    } catch (err) {
        loading.style.display = 'none';
        startBtn.style.display = 'block';
        alert('Kamera gagal dibuka!');
        console.error(err);
    }
});
</script>

</body>
</html>
