<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RETROLENS Hand Tracking - Smooth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video { display: none; }

        #output-canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #header-overlay {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 10;
            color: #00ffcc;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,0,0,0.8), 1px 1px 2px #000;
            pointer-events: none;
            line-height: 1.4;
        }

        #header-overlay .yellow { color: #ffff00; }

        #start-btn {
            position: fixed;
            z-index: 20;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            background: #ffff00;
            color: #000;
            border: 2px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.8);
            font-family: sans-serif;
        }
    </style>
</head>
<body>

<div id="container">
    <video id="video" playsinline></video>
    <canvas id="output-canvas"></canvas>
</div>

<div id="header-overlay">
    <div id="mode-info" class="yellow">MODE: 3D (Full 5 Jari) [Kepal 2 Tangan]</div>
    <div id="filter-info">FILTER: GLITCH [Sentuh Jempol-Kelingking]</div>
</div>

<button id="start-btn">MULAI RETROLENS (SMOOTH) 🎥</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('output-canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const startBtn = document.getElementById('start-btn');

const modes = ['3D (Full 5 Jari)', 'PERSEGI 2D', 'BOWTIE 2D'];
let currentModeIndex = 0;

const filters = ['GLITCH', 'SKETCH', 'THERMAL', 'INVERT', 'CARTOON', 'EDGES', 'RED_CHANNEL'];
let currentFilterIndex = 0;

let lastFilterSwitchTime = 0;
let lastModeSwitchTime = 0;

function updateHeaderUI() {
    document.getElementById('mode-info').textContent = `MODE: ${modes[currentModeIndex]} [Kepal 2 Tangan]`;
    document.getElementById('filter-info').textContent = `FILTER: ${filters[currentFilterIndex]} [Jempol-Kelingking]`;
}

// Setup MediaPipe Hands dengan setting ringan (modelComplexity: 0)
const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 0, // Dibuat 0 agar sangat ringan dan ngebut di HP
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

hands.onResults((results) => {
    if (canvas.width !== video.videoWidth) {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 360;
    }

    ctx.save();
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    const landmarks = results.multiHandLandmarks;

    if (landmarks && landmarks.length > 0) {
        for (const hand of landmarks) {
            drawConnectors(ctx, hand, HAND_CONNECTIONS, { color: '#ffffff', lineWidth: 2 });
            drawLandmarks(ctx, hand, { color: '#ffff00', fillColor: '#0055ff', lineWidth: 1, radius: 3 });
        }

        checkHandGestures(landmarks);

        if (landmarks.length === 2) {
            const h1 = landmarks[0];
            const h2 = landmarks[1];

            const p1 = { x: h1[4].x * canvas.width, y: h1[4].y * canvas.height };  
            const p2 = { x: h1[20].x * canvas.width, y: h1[20].y * canvas.height }; 
            const p3 = { x: h2[20].x * canvas.width, y: h2[20].y * canvas.height }; 
            const p4 = { x: h2[4].x * canvas.width, y: h2[4].y * canvas.height };  

            renderRetroLensFilter([p1, p2, p3, p4]);
        }
    }

    ctx.restore();
});

function checkHandGestures(landmarks) {
    const now = Date.now();
    const getDist = (pt1, pt2) => Math.hypot(pt1.x - pt2.x, pt1.y - pt2.y);

    for (const hand of landmarks) {
        if (getDist(hand[4], hand[20]) < 0.08 && (now - lastFilterSwitchTime > 1000)) {
            currentFilterIndex = (currentFilterIndex + 1) % filters.length;
            lastFilterSwitchTime = now;
            updateHeaderUI();
        }
    }

    if (landmarks.length === 2) {
        const isFist1 = getDist(landmarks[0][8], landmarks[0][0]) < 0.25;
        const isFist2 = getDist(landmarks[1][8], landmarks[1][0]) < 0.25;

        if (isFist1 && isFist2 && (now - lastModeSwitchTime > 1500)) {
            currentModeIndex = (currentModeIndex + 1) % modes.length;
            lastModeSwitchTime = now;
            updateHeaderUI();
        }
    }
}

function renderRetroLensFilter(points) {
    ctx.save();

    if (modes[currentModeIndex] === 'BOWTIE 2D') {
        let temp = points[2];
        points[2] = points[3];
        points[3] = temp;
    }

    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.closePath();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 8;
    ctx.stroke();

    if (modes[currentModeIndex] === '3D (Full 5 Jari)') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.5;
        const offset = 35;

        ctx.beginPath();
        ctx.moveTo(points[0].x - offset, points[0].y - offset);
        ctx.lineTo(points[1].x - offset, points[1].y - offset);
        ctx.lineTo(points[2].x - offset, points[2].y - offset);
        ctx.lineTo(points[3].x - offset, points[3].y - offset);
        ctx.closePath();
        ctx.stroke();

        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(points[i].x, points[i].y);
            ctx.lineTo(points[i].x - offset, points[i].y - offset);
            ctx.stroke();
        }
    }

    ctx.clip();

    const minX = Math.max(0, Math.floor(Math.min(...points.map(p => p.x))));
    const minY = Math.max(0, Math.floor(Math.min(...points.map(p => p.y))));
    const maxX = Math.min(canvas.width, Math.ceil(Math.max(...points.map(p => p.x))));
    const maxY = Math.min(canvas.height, Math.ceil(Math.max(...points.map(p => p.y))));

    const w = maxX - minX;
    const h = maxY - minY;

    if (w > 0 && h > 0) {
        const imgData = ctx.getImageData(minX, minY, w, h);
        processFilterPixels(imgData, filters[currentFilterIndex]);
        ctx.putImageData(imgData, minX, minY);
    }

    ctx.restore();
}

function processFilterPixels(imgData, filter) {
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i+1], b = d[i+2];
        let gray = 0.299 * r + 0.587 * g + 0.114 * b;

        switch (filter) {
            case 'GLITCH':
                d[i] = (r + 40) % 255;
                d[i+1] = gray;
                d[i+2] = (b * 1.5) % 255;
                break;
            case 'SKETCH':
                let v = gray > 110 ? 255 : 0;
                d[i] = v; d[i+1] = v; d[i+2] = v;
                break;
            case 'THERMAL':
                d[i] = Math.min(255, gray * 2);
                d[i+1] = 255 - gray;
                d[i+2] = Math.max(0, 255 - gray * 2);
                break;
            case 'INVERT':
                d[i] = 255 - r; d[i+1] = 255 - g; d[i+2] = 255 - b;
                break;
            case 'CARTOON':
                d[i] = Math.floor(r / 80) * 80;
                d[i+1] = Math.floor(g / 80) * 80;
                d[i+2] = Math.floor(b / 80) * 80;
                break;
            case 'EDGES':
                let edge = gray < 90 ? 255 : 0;
                d[i] = 0; d[i+1] = edge; d[i+2] = edge;
                break;
            case 'RED_CHANNEL':
                d[i] = 255; d[i+1] = gray * 0.1; d[i+2] = gray * 0.1;
                break;
        }
    }
}

startBtn.addEventListener('click', async () => {
    startBtn.style.display = 'none';
    updateHeaderUI();
    try {
        const cameraUtils = new Camera(video, {
            onFrame: async () => {
                await hands.send({ image: video });
            },
            width: 640,
            height: 360
        });
        await cameraUtils.start();
    } catch (e) {
        alert("Gagal mengaktifkan kamera: " + e.message);
        startBtn.style.display = 'block';
    }
});
</script>
</body>
</html>
